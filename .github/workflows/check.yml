name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The lockfile also guards the workspace shape: `packages/kernel` and `packages/dsh` are importers, and the run fails if a
      # manifest and the lockfile disagree. The kernel boundary and the layer rules are tests, so `pnpm test` is what refuses a
      # host dependency inside `packages/kernel` or a Source that imports `src/app`; nothing here needs a separate job.
      - run: pnpm install --frozen-lockfile
      # X-11 composes an installed profile through the host's own `dsh --dump-config`. The CLI is the host, not a workspace
      # dependency, so install the version `engines.dsh` admits; a host without it must make this step fail rather than skip the test.
      # The dump is boot-free, so the host's native build scripts are not needed.
      - run: npm install -g --no-audit --no-fund --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.5
      - run: pnpm check

  # X-13: the plan, the tracking table and the pull requests they name must agree. The other jobs run the offline half
  # through `pnpm check`; this job has the token that turns a dead link or a still-open PR on a completed row red.
  tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-tracking.mjs --check-prs
        env:
          GH_TOKEN: ${{ github.token }}

  # Malformed changesets fail here rather than in a release, so a package change always says which package it bumps.
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull-request checkout is detached and has no local `main`; changesets resolves its base branch by name.
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - run: pnpm changeset status
